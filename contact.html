<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>ติดต่อเรา | Mellow Café</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/styles.css">

</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>


    <!-- ================= HEADER ================= -->

    <section class="page-header">

        <div class="container text-center text-white">

            <h1 class="display-4 fw-bold">
                ติดต่อเรา
            </h1>

            <p class="lead">
                เรายินดีรับฟังความคิดเห็นจากคุณ
            </p>

        </div>

    </section>


    <!-- ================= CONTACT ================= -->

    <section class="py-5">

        <div class="container">

            <div class="row g-5">


                <!-- FORM -->

                <div class="col-lg-7">

                    <h2 class="fw-bold mb-4">
                        ส่งข้อความถึงเรา
                    </h2>

                    <form id="contactForm">


                        <div class="mb-3">

                            <label class="form-label">
                                ชื่อ-นามสกุล
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="กรุณากรอกชื่อ-นามสกุล"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   placeholder="example@email.com"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                เบอร์โทรศัพท์
                            </label>

                            <input type="tel"
                                   class="form-control"
                                   placeholder="099-999-9999"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                หัวข้อ
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="หัวข้อที่ต้องการติดต่อ"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                รายละเอียด
                            </label>

                            <textarea class="form-control"
                                      rows="5"
                                      placeholder="กรุณากรอกรายละเอียด"
                                      required></textarea>

                        </div>


                        <button type="submit"
                                class="btn btn-warning btn-lg">

                            <i class="bi bi-send"></i>
                            ส่งข้อความ

                        </button>

                    </form>

                </div>


                <!-- CONTACT INFORMATION -->

                <div class="col-lg-5">

                    <div class="contact-box p-4 rounded-4 shadow-sm">

                        <h3 class="fw-bold mb-4">
                            ข้อมูลการติดต่อ
                        </h3>


                        <p>

                            <i class="bi bi-geo-alt-fill contact-icon"></i>

                            99 ถนนสุขุมวิท
                            จังหวัดชลบุรี

                        </p>


                        <p>

                            <i class="bi bi-telephone-fill contact-icon"></i>

                            099-999-9999

                        </p>


                        <p>

                            <i class="bi bi-envelope-fill contact-icon"></i>

                            mellowcafe@email.com

                        </p>


                        <p>

                            <i class="bi bi-clock-fill contact-icon"></i>

                            เปิดทุกวัน 08:00 - 18:00 น.

                        </p>

                    </div>


                    <!-- MAP -->

                    <div class="mt-4">

                        <iframe
                            src="https://www.google.com/maps?q=Chonburi,Thailand&output=embed"
                            width="100%"
                            height="300"
                            style="border:0;"
                            allowfullscreen=""
                            loading="lazy">
                        </iframe>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <div id="footer"></div>


    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="js/scripts.js"></script>

</body>
</html>
